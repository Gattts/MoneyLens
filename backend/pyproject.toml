[project]
name = "financeiro"
version = "0.1.0"
description = "API da ferramenta de acompanhamento financeiro pessoal"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf[crypto]>=6.1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "numpy>=2.0",
    "onnxruntime>=1.20",
]

[project.scripts]
financeiro = "financeiro.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
# Treino do modelo de previsão (financeiro treinar): fica fora da imagem de produção (uv sync --no-dev).
ml = [
    "onnx>=1.17",
    "onnxscript>=0.2",
    "torch>=2.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C90", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "PLR2004"]
"src/financeiro/migrations/versions/**" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/financeiro/migrations/versions/"]

[[tool.mypy.overrides]]
# O treino só existe com o grupo `ml` (uv sync --group ml); sem o PyTorch instalado, faltam os tipos dele.
module = ["torch", "torch.*", "onnx", "onnxscript", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["financeiro.forecast.model", "financeiro.forecast.train"]
disallow_subclassing_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
