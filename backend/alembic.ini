# Usado só pela linha de comando do Alembic (ex.: `uv run alembic revision --autogenerate -m "..."`).
# A aplicação aplica as migrações sozinha em `financeiro serve` e `financeiro migrate`.
# A URL do banco vem de FIN_DATABASE_URL (ou do padrão backend/data/financeiro.db).

[alembic]
script_location = %(here)s/src/financeiro/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
